<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cadastroLogin.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Cadastro - Sorveteria Nuvem</title>
</head>

<body>

    <header>
        <h1 class="tituloNuvem">☁️ Cadastro Nuvem</h1>
    </header>

    <nav>
        <ul>
            <li><a href="./index.html">🏠 Home</a></li>
            <li><a href="./cardapio.html">🍓 Cardápio</a></li>
            <li><a href="./contato.html">📞 Contato</a></li>
            <li><a href="./formulario.html">🍨 Pedidos</a></li>
        </ul>
    </nav>

    <section class="cadastroContainer">
        <form>
            <label for="inNome">Nome Completo</label>
            <input type="text" id="inNome" placeholder="Digite seu nome" required
                oninvalid="this.setCustomValidity('Informe seu nome completo')" oninput="this.setCustomValidity('')">

            <label for="inEmail">E-mail</label>
            <input type="email" id="inEmail" placeholder="Digite seu e-mail" required
                oninvalid="this.setCustomValidity('Informe seu e-mail')" oninput="this.setCustomValidity('')">

            <label for="inSenha">Senha</label>
            <input type="password" id="inSenha" placeholder="Digite sua senha" required minlength="6"
                oninvalid="this.setCustomValidity('A senha deve ter pelo menos 6 caracteres')"
                oninput="this.setCustomValidity('')">

            <label for="inEndereco">Endereço</label>
            <input type="text" id="inEndereco" placeholder="Rua, número e bairro" required
                oninvalid="this.setCustomValidity('Informe seu endereço')" oninput="this.setCustomValidity('')">

            <label for="inComplemento">Complemento</label>
            <input type="text" id="inComplemento" placeholder="Casa, apartamento, bloco...">

            <label for="inCidade">Cidade</label>
            <input type="text" id="inCidade" placeholder="Digite sua cidade" required
                oninvalid="this.setCustomValidity('Informe sua cidade')" oninput="this.setCustomValidity('')">

            <label for="inEstado">Estado</label>
            <select id="inEstado" required oninvalid="this.setCustomValidity('Selecione um estado')"
                oninput="this.setCustomValidity('')">
                <option value="">Selecione</option>
                <option>ES</option>
                <option>MG</option>
                <option>RJ</option>
                <option>SP</option>
            </select>

            <label for="inCep">CEP</label>
            <input type="text" id="inCep" placeholder="Digite seu CEP" required
                oninvalid="this.setCustomValidity('Informe seu CEP')" oninput="this.setCustomValidity('')">

            <div class="form-check">
                <input type="checkbox" id="termos" required
                    oninvalid="this.setCustomValidity('Você deve aceitar os termos de uso')"
                    onchange="this.setCustomValidity('')">

                <label for="termos">Aceito os termos de uso</label>
            </div>

            <button type="submit">Cadastrar</button>

        </form>
    </section>

</body>

</html>
